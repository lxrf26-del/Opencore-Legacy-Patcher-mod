name: CI - Build Hackintosh Mod

on:
  push:
    branches: [mod]
    tags: ['*+m.*']
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'b00t0x/OpenCore-Legacy-Patcher'
    runs-on: macos-15-intel
    env:
      PYTHON: /Library/Frameworks/Python.framework/Versions/3.11/bin/python3
      OCLP_PYINSTALLER_ARCH: x86_64
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python.org 3.11.9
        run: |
          curl --fail --location --retry 3 https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg -o "$RUNNER_TEMP/python.pkg"
          test "$(md5 -q "$RUNNER_TEMP/python.pkg")" = fa29f456feb6b5c4f52456a8b8ba347b
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          "$PYTHON" -m pip install -r requirements.txt
      - name: Fetch released PatcherSupportPkg
        run: |
          version=$("$PYTHON" -c 'from opencore_legacy_patcher.constants import Constants; print(Constants().patcher_support_pkg_version)')
          gh release download "$version" --repo b00t0x/PatcherSupportPkg --pattern Universal-Binaries.dmg --pattern sha256sum.txt
          shasum -a 256 -c sha256sum.txt
          codesign --verify -R '=certificate leaf = H"6DE7FC5377DEAC4F5FE21194684F57F553C3592C"' Universal-Binaries.dmg
      - name: Prepare assets and application
        run: |
          "$PYTHON" Build-Project.command --run-as-individual-steps --prepare-assets
          "$PYTHON" Build-Project.command --run-as-individual-steps --prepare-application --git-branch "$GITHUB_REF_NAME" --git-commit-url "https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" --git-commit-date "$(git show -s --format=%cI HEAD)"
      - name: Fetch pinned rcodesign
        run: |
          curl --fail --location --retry 3 https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-x86_64-apple-darwin.tar.gz -o "$RUNNER_TEMP/rcodesign.tar.gz"
          echo "14ef11bedd51a8d95eafd767939ae96d5900e5a61511bef75bb21db6e7c74140  $RUNNER_TEMP/rcodesign.tar.gz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/rcodesign"
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP/rcodesign" --strip-components=1
      - name: Sign application and verify helper
        env:
          MOD_APP_P12: ${{ secrets.MOD_APP_P12 }}
          MOD_APP_P12_PASSWORD: ${{ secrets.MOD_APP_P12_PASSWORD }}
        run: |
          "$PYTHON" - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for name, data in [('mod-app.p12', base64.b64decode(os.environ['MOD_APP_P12'])), ('mod-app.password', os.environ['MOD_APP_P12_PASSWORD'].encode())]:
              path = root / name
              path.write_bytes(data)
              path.chmod(0o600)
          PY
          "$PYTHON" ci_tooling/sign_mod.py --app dist/OpenCore-Patcher.app --p12-file "$RUNNER_TEMP/mod-app.p12" --p12-password-file "$RUNNER_TEMP/mod-app.password" --rcodesign "$RUNNER_TEMP/rcodesign/rcodesign" --entitlements ci_tooling/entitlements/entitlements.plist
          codesign --verify --strict --all-architectures -R '=certificate leaf = H"19FD838A17B096F42774B90A438950EC8052A4A5"' ci_tooling/privileged_helper_tool/com.dortania.opencore-legacy-patcher.privileged-helper
      - name: Build installer
        run: |
          "$PYTHON" Build-Project.command --run-as-individual-steps --prepare-package
          cd dist
          shasum -a 256 OpenCore-Patcher.pkg > sha256sum.txt
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mod-app.p12" "$RUNNER_TEMP/mod-app.password"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher-Mod
          path: |
            dist/OpenCore-Patcher.pkg
            dist/sha256sum.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPkg-Assets.pkg
          path: dist/AutoPkg-Assets.pkg
          if-no-files-found: error
