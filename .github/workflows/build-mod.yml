name: CI - Build OCLP Mod Beta

on:
  push:
    branches:
      - beta  # Triggers automatically when you push to the beta branch
  workflow_dispatch: # Allows manual runs anytime

jobs:
  build:
    runs-on: macos-14
    steps:
      # ... (Leave the middle installation/build steps exactly as bOOtOx has them) ...

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Legacy-Patcher-Mod-BETA  # Clearly tags your download as a beta
          path: dist/
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Legacy-Patcher-Mod-BETA
          path: |
            **/*.zip
            **/*.pkg
          if-no-files-found: error
